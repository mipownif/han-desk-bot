<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HAN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
  <style>
    :root {
      --bg:#090b0e; --fg:#eef1f5; --card:#12151a; --sunken:#0c0e12; --raised:#191d24;
      --mute:#8a929e; --faint:#5c6470; --up:#5ec98a; --down:#e06a72; --metal:#c5ccd6;
      --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.4 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    body {
      min-height: 100dvh;
      padding: calc(8px + var(--sat) + var(--tg-content-safe-area-inset-top, 0px)) 14px
        calc(24px + var(--sab) + var(--tg-content-safe-area-inset-bottom, 0px));
    }
    .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; }
    .mark { height: 40px; color: var(--mute); }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px;
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase; background: var(--raised); color: var(--up); }
    .who { font-size: 12px; color: var(--faint); text-align: right; margin-top: 6px; }
    .search { position: relative; }
    .search input { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--card); color: var(--fg);
      font: 500 16px inherit; padding: 0 14px; outline: none; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
    .hits { display: none; margin-top: 6px; background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.4); }
    .hits.on { display: block; }
    .hits button { display: flex; justify-content: space-between; width: 100%; min-height: 48px; border: 0;
      background: transparent; color: var(--fg); padding: 0 14px; font: 500 15px inherit; text-align: left; }
    .hits button span { color: var(--mute); font: 13px "IBM Plex Mono", monospace; }
    .watch { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
    .watch button { flex: 0 0 auto; height: 40px; border: 0; border-radius: 999px; padding: 0 14px;
      background: var(--card); color: var(--mute); font: 500 13px inherit; }
    .watch button.on { background: var(--raised); color: var(--fg); }
    .card { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
    .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
    .px { font: 500 30px/1.05 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: -.03em; margin: 6px 0 2px; }
    .up { color: var(--up); } .dn { color: var(--down); }
    .dim { color: var(--mute); font-size: 13px; }
    .grid3, .grid4 { display: grid; gap: 8px; margin-top: 10px; }
    .grid3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .cell { background: var(--sunken); border-radius: 8px; padding: 8px 10px; }
    .v { font: 13px/1.35 "IBM Plex Mono", ui-monospace, monospace; margin-top: 4px; }
    .seg { display: grid; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 10px; }
    .seg.p2 { grid-template-columns: 1fr 1fr; }
    .seg.p4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .seg.p6 { grid-template-columns: repeat(6, 1fr); }
    .seg button { min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--mute); font: 500 12px inherit; }
    .seg button.on { background: var(--raised); color: var(--fg); }
    .gap { display: flex; flex-direction: column; gap: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input.sz { width: 100%; height: 48px; border: 0; border-radius: 8px; background: var(--sunken); color: var(--fg);
      font: 500 16px "IBM Plex Mono", monospace; padding: 0 12px; outline: none; }
    .field span { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
    .btn { min-height: 48px; width: 100%; border: 0; border-radius: 10px; font: 500 15px inherit; background: var(--metal); color: var(--bg); }
    .btn.ghost { background: var(--raised); color: var(--fg); }
    .btn.kill { background: var(--down); color: #fff; }
    .btn.buy { background: var(--up); color: var(--bg); }
    svg.chart { width: 100%; height: 168px; display: block; }
    .orders div { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--sunken); border-radius: 8px; padding: 10px 12px; margin-top: 6px; font-size: 13px; }
    .orders button { height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--raised); color: var(--fg); }
    .sheet { display: none; position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--sab));
      background: var(--card); border-radius: 16px; padding: 16px; z-index: 30; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    .sheet.on { display: block; }
    .msg { font-size: 13px; color: var(--mute); min-height: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg class="mark" viewBox="0 0 300 112" aria-label="HAN">
        <defs><linearGradient id="m" x1=".08" y1="0" x2=".22" y2="1">
          <stop offset="0%" stop-color="#f7f8fa"/><stop offset="38%" stop-color="#cfd5dd"/><stop offset="100%" stop-color="#8a939e"/>
        </linearGradient></defs>
        <g fill="url(#m)" transform="translate(16 0) skewX(-8)">
          <path d="M18 8h22v30h18V8h22v72H58V50H40v30H18l-16 0 16-18Z"/>
          <path fill-rule="evenodd" d="M128 8 192 80h-30l-12-26h-16L124 80H98L128 8Zm2 20 18 24h-24L130 28Z"/>
          <path d="M206 8h24v20L268 8h26v72h-26V54L230 80h-24V8Z"/>
        </g>
        <text x="150" y="106" text-anchor="middle" fill="currentColor" style="font:500 10px 'IBM Plex Sans';letter-spacing:.72em">AND ONLY</text>
      </svg>
      <div>
        <span class="pill" id="pill">LIVE</span>
        <div class="who" id="who">HAN</div>
      </div>
    </header>

    <div class="search">
      <input id="q" type="search" placeholder="코인 검색  BTC  ETH  PEPE  SOL" enterkeyhint="search" autocomplete="off" />
      <div class="hits" id="hits"></div>
    </div>
    <div class="watch" id="watch"></div>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="k" id="sym">BTC-USDT</span>
        <span class="k" id="chg">—</span>
      </div>
      <div class="px" id="last">—</div>
      <div class="dim" id="rng">고가 · 저가</div>
      <div class="seg p6" id="tf" style="margin:10px 0 8px">
        <button data-b="1m">1m</button>
        <button data-b="5m">5m</button>
        <button data-b="15m" class="on">15m</button>
        <button data-b="1H">1H</button>
        <button data-b="4H">4H</button>
        <button data-b="1D">1D</button>
      </div>
      <svg class="chart" id="chart" viewBox="0 0 320 168" preserveAspectRatio="none"></svg>
      <div class="grid4">
        <div class="cell"><div class="k">Bid</div><div class="v" id="bid">—</div></div>
        <div class="cell"><div class="k">Ask</div><div class="v" id="ask">—</div></div>
        <div class="cell"><div class="k">Spread</div><div class="v" id="spr">—</div></div>
        <div class="cell"><div class="k">24h</div><div class="v" id="vol">—</div></div>
      </div>
    </section>

    <section class="card">
      <div class="k">잔고</div>
      <div class="v" id="bal" style="margin-top:8px;white-space:pre">텔레그램에서 실잔고</div>
    </section>

    <section class="card gap">
      <div style="display:flex;justify-content:space-between"><span class="k">주문</span><span class="k" id="tkstat">현물</span></div>
      <div class="seg p2" id="side"><button data-s="buy" class="on">매수</button><button data-s="sell">매도</button></div>
      <div class="seg p2" id="typ"><button data-t="market" class="on">시장가</button><button data-t="limit">지정가</button></div>
      <label class="field"><span id="szlab">수량 USDT</span><input class="sz" id="sz" value="25" inputmode="decimal" /></label>
      <div class="seg p4" id="chips">
        <button data-c="10">10</button><button data-c="25" class="on">25</button>
        <button data-c="50">50</button><button data-c="100">100</button>
      </div>
      <label class="field" id="pxrow" style="display:none"><span>지정가</span><input class="sz" id="lpx" inputmode="decimal" /></label>
      <div class="dim" id="prev">—</div>
      <button class="btn buy" id="go">주문 검토</button>
      <div class="msg" id="omsg"></div>
      <div class="orders" id="olist"></div>
    </section>

    <section class="card gap">
      <div style="display:flex;justify-content:space-between"><span class="k">자동</span><span class="k" id="amode">해제</span></div>
      <button class="btn kill" id="kill">긴급정지</button>
      <div class="row2">
        <label class="field"><span>건당 USDT</span><input class="sz" id="amax" value="25" inputmode="numeric" /></label>
        <label class="field"><span>일일 한도</span><input class="sz" id="aday" value="200" inputmode="numeric" /></label>
      </div>
      <div class="dim" id="agate">지금 보고 있는 페어만 ARM. 검색한 종목으로 바뀜.</div>
      <button class="btn ghost" id="arm">ARM 검토</button>
    </section>
  </div>

  <div class="sheet" id="sheet">
    <div class="k" id="sheett">확인</div>
    <p class="dim" id="sheetb" style="margin:10px 0 14px"></p>
    <div class="row2">
      <button class="btn ghost" id="sheetx">취소</button>
      <button class="btn kill" id="sheety">실주문</button>
    </div>
  </div>

  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    var init = (tg && tg.initData) || "";
    var inst = "BTC-USDT";
    var bar = "15m";
    var side = "buy";
    var typ = "market";
    var quote = null;
    var sheetMode = "";
    var timer = 0;
    var WKEY = "han-watch";
    if (tg) {
      tg.ready(); tg.expand();
      tg.setBackgroundColor && tg.setBackgroundColor("#090b0e");
      tg.setHeaderColor && tg.setHeaderColor("#090b0e");
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    }
    function $(id) { return document.getElementById(id); }
    $("who").textContent = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "HAN";
    function hap(t) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} }
    function hdr() { var h = { "content-type": "application/json" }; if (init) h["X-Telegram-Init-Data"] = init; return h; }
    function n(v) { var x = Number(v); return Number.isFinite(x) ? x : 0; }
    function fmt(v) { v = n(v); if (!v) return "—"; return v >= 100 ? v.toLocaleString(undefined, { maximumFractionDigits: 2 }) : v.toPrecision(6).replace(/0+$/,"").replace(/\.$/,""); }
    async function jget(url) { var r = await fetch(url, { headers: hdr() }); try { return await r.json(); } catch (e) { return { ok:false }; } }
    async function jpost(url, body) { var r = await fetch(url, { method:"POST", headers: hdr(), body: JSON.stringify(body) }); try { return await r.json(); } catch (e) { return { ok:false }; } }
    function setOn(root, attr, val) {
      [].forEach.call(root.querySelectorAll("button"), function (b) { b.className = b.getAttribute(attr) === val ? "on" : ""; });
    }
    function watch() { try { return JSON.parse(localStorage.getItem(WKEY) || '["BTC-USDT","ETH-USDT","SOL-USDT"]'); } catch (e) { return ["BTC-USDT"]; } }
    function saveWatch(rows) { localStorage.setItem(WKEY, JSON.stringify(rows)); renderWatch(); }
    function renderWatch() {
      var rows = watch();
      $("watch").innerHTML = rows.map(function (id) {
        return '<button data-id="'+id+'" class="'+(id===inst?"on":"")+'">'+id.replace("-USDT","")+'</button>';
      }).join("");
    }
    function pick(id) {
      inst = id;
      var rows = watch();
      if (rows.indexOf(id) < 0) { rows.unshift(id); if (rows.length > 12) rows.pop(); saveWatch(rows); }
      else renderWatch();
      $("hits").className = "hits"; $("q").blur();
      hap(); loadAll();
    }
    $("watch").onclick = function (e) { var b = e.target.closest("button"); if (b) pick(b.getAttribute("data-id")); };
    var searchT;
    $("q").oninput = function () {
      clearTimeout(searchT);
      var q = $("q").value.trim();
      if (!q) { $("hits").className = "hits"; return; }
      searchT = setTimeout(async function () {
        var j = await jget("/api/instruments?q=" + encodeURIComponent(q));
        var box = $("hits");
        if (!j.ok || !j.rows.length) { box.innerHTML = '<button disabled>없음</button>'; box.className = "hits on"; return; }
        box.innerHTML = j.rows.map(function (it) {
          return '<button data-id="'+it.instId+'">'+it.instId+'<span>'+it.base+'</span></button>';
        }).join("");
        box.className = "hits on";
      }, 180);
    };
    $("hits").onclick = function (e) { var b = e.target.closest("button"); if (b && b.getAttribute("data-id")) pick(b.getAttribute("data-id")); };
    $("tf").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; bar = b.getAttribute("data-b"); setOn($("tf"), "data-b", bar); hap(); loadChart(); };
    $("side").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; side = b.getAttribute("data-s"); setOn($("side"), "data-s", side); preview(); };
    $("typ").onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return; typ = b.getAttribute("data-t"); setOn($("typ"), "data-t", typ);
      $("pxrow").style.display = typ === "limit" ? "" : "none";
      if (typ === "limit" && quote) $("lpx").value = quote.last;
      preview();
    };
    $("chips").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; $("sz").value = b.getAttribute("data-c"); setOn($("chips"), "data-c", $("sz").value); preview(); };
    $("sz").oninput = preview;
    function preview() {
      var sz = n($("sz").value);
      var base = inst.split("-")[0];
      $("szlab").textContent = "수량 " + (side === "buy" ? "USDT" : base);
      if (!(sz > 0) || !quote) { $("prev").textContent = inst; return; }
      var px = typ === "limit" ? n($("lpx").value) : n(quote.last);
      $("prev").textContent = (side === "buy" ? "매수 " : "매도 ") + inst + " · " + (side === "buy" ? (fmt(sz) + " USDT") : (sz + " " + base));
      $("go").className = "btn " + (side === "buy" ? "buy" : "kill");
    }
    function draw(cs) {
      var svg = $("chart"); svg.innerHTML = "";
      if (!cs || !cs.length) return;
      var min = Math.min.apply(null, cs.map(function (b) { return b.l; }));
      var max = Math.max.apply(null, cs.map(function (b) { return b.h; }));
      var vmax = Math.max.apply(null, cs.map(function (b) { return b.v || 0; })) || 1;
      var span = max - min || 1, w = 320, top = 4, ch = 118, vh = 36, slot = w / cs.length, bw = Math.max(1.6, slot * .62);
      function y(v) { return top + (1 - (v - min) / span) * ch; }
      cs.forEach(function (bar, i) {
        var up = bar.c >= bar.o, x = i * slot + (slot - bw) / 2, mid = x + bw / 2;
        var t = y(Math.max(bar.o, bar.c)), btm = y(Math.min(bar.o, bar.c));
        var col = up ? "#5ec98a" : "#e06a72";
        var volH = ((bar.v || 0) / vmax) * vh;
        svg.innerHTML += '<line x1="'+mid+'" x2="'+mid+'" y1="'+y(bar.h)+'" y2="'+y(bar.l)+'" stroke="'+col+'" stroke-width="1"/>';
        svg.innerHTML += '<rect x="'+x+'" y="'+t+'" width="'+bw+'" height="'+Math.max(1.2, btm-t)+'" fill="'+col+'"/>';
        svg.innerHTML += '<rect x="'+x+'" y="'+(164-volH)+'" width="'+bw+'" height="'+volH+'" fill="'+col+'" opacity=".28"/>';
      });
    }
    async function loadChart() {
      var c = await jget("/api/candles?instId=" + encodeURIComponent(inst) + "&bar=" + encodeURIComponent(bar));
      if (c && c.ok) draw(c.candles);
    }
    async function loadTicker() {
      var j = await jget("/api/ticker?instId=" + encodeURIComponent(inst));
      if (!j || !j.ok) return;
      quote = j;
      var last = n(j.last), open = n(j.open24h), pct = open ? ((last - open) / open) * 100 : 0;
      $("sym").textContent = j.instId;
      $("last").textContent = fmt(last);
      $("last").className = "px " + (pct >= 0 ? "up" : "dn");
      $("chg").textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
      $("chg").className = "k " + (pct >= 0 ? "up" : "dn");
      $("rng").textContent = "고 " + fmt(j.high24h) + "  저 " + fmt(j.low24h);
      $("bid").textContent = fmt(j.bid);
      $("ask").textContent = fmt(j.ask);
      $("spr").textContent = (j.ask && j.bid) ? fmt(n(j.ask) - n(j.bid)) : "—";
      $("vol").textContent = fmt(j.volCcy24h);
      preview();
    }
    async function loadBal() {
      var j = await jget("/api/balance");
      var el = $("bal");
      if (j && j.ok) el.textContent = "USDT eq " + fmt(j.totalEq) + "\n" + (j.rows || []).map(function (r) { return r.ccy + "  " + fmt(r.avail); }).join("\n");
      else el.textContent = (j && j.message) || "텔레그램에서 실잔고";
      var o = await jget("/api/orders");
      var box = $("olist"); box.innerHTML = "";
      if (o && o.ok && o.orders) o.orders.forEach(function (row) {
        var d = document.createElement("div");
        d.innerHTML = "<span>" + row.side + " " + row.instId + " " + row.sz + "</span>";
        var b = document.createElement("button"); b.textContent = "취소";
        b.onclick = async function () { await jpost("/api/order-cancel", { confirm: true, ordId: row.ordId, instId: row.instId }); loadBal(); };
        d.appendChild(b); box.appendChild(d);
      });
    }
    function openSheet(mode, title, body, yes) {
      sheetMode = mode; $("sheett").textContent = title; $("sheetb").textContent = body; $("sheety").textContent = yes;
      $("sheet").className = "sheet on"; hap("medium");
    }
    function closeSheet() { sheetMode = ""; $("sheet").className = "sheet"; }
    async function doSheet() {
      if (sheetMode === "order") {
        var body = { instId: inst, side: side, ordType: typ, sz: $("sz").value, confirm: true, tgtCcy: side === "buy" ? "quote_ccy" : "base_ccy" };
        if (typ === "limit") body.px = $("lpx").value;
        var j = await jpost("/api/order", body);
        $("tkstat").textContent = j && j.ok ? ("체결 " + (j.ordId || "")) : ((j && j.message) || "거절");
        $("omsg").textContent = j && j.message || (j && j.ok ? "전송" : "");
        closeSheet(); loadBal();
      } else if (sheetMode === "arm") {
        var j = await jpost("/api/auto", { armed: true, confirm: true, maxUsdt: n($("amax").value), maxDailyUsdt: n($("aday").value), pairs: [inst], model: "gemini" });
        $("amode").textContent = j && j.ok && j.config && j.config.armed ? "무장 " + inst : ((j && j.message) || "미연결");
        closeSheet();
      }
    }
    $("go").onclick = function () {
      if (!init) { $("omsg").textContent = "텔레그램에서만 실주문"; return; }
      openSheet("order", "실주문", $("prev").textContent, side === "buy" ? "매수" : "매도");
    };
    $("sheetx").onclick = closeSheet;
    $("sheety").onclick = doSheet;
    $("kill").onclick = async function () { await jpost("/api/auto", { armed: false, confirm: true }); $("amode").textContent = "해제"; };
    $("arm").onclick = function () { openSheet("arm", "ARM " + inst, "지금 차트에 있는 페어만. 건당 " + $("amax").value + " USDT", "ARM"); };
    async function loadAll() { await loadTicker(); await loadChart(); await loadBal(); }
    renderWatch();
    loadAll();
    setInterval(function () { loadTicker(); loadChart(); }, 8000);
    setInterval(loadBal, 20000);
  </script>
</body>
</html>
